server:
  port: 8080
spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fm_identity}
    username: ${SPRING_DATASOURCE_USERNAME:fm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fm_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt-secret: ${JWT_SECRET:dev_jwt_secret_change_me}
  issuer: identity-service