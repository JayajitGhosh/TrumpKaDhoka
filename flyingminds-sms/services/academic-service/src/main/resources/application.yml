server:
  port: 8080
spring:
  application:
    name: academic-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/fm_academic}
    username: ${SPRING_DATASOURCE_USERNAME:fm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fm_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
services:
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:8082}