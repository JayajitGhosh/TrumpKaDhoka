server:
  port: 8080
spring:
  application:
    name: admin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/fm_admin}
    username: ${SPRING_DATASOURCE_USERNAME:fm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fm_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
services:
  identity-base-url: ${IDENTITY_BASE_URL:http://localhost:8081}